name: DFP Bossmap Bot

on:
  schedule:
    # 每 15 分鐘一次（避開 :00 的排程尖峰，GitHub 實際執行常會再延遲幾分鐘）
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "立刻發一則整點報告（測試用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bossmap-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_REPORT: ${{ inputs.force_report }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "bossmap-bot"
          git config user.email "bossmap-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state 沒有變動"
          else
            git commit -m "update state [skip ci]"
            git pull --rebase
            git push
          fi
